name: dyfala
description: Dyfala! — a daily Welsh word game.
publish_to: none
version: 0.18.0+27

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/icon-192.png
    - assets/icons/icon-512.png
    - assets/brand/dyfala-logo.png
    - assets/approved/home-logo.png
    - assets/approved/home-scene.png
    - assets/approved/home-master-v09.png
    - assets/approved/home-background-v10.png
    - assets/approved/home-en.png
    - assets/approved/home-cy.png
    - assets/approved/help-en.png
    - assets/approved/help-cy.png
