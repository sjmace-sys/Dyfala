name: Build Dyfala Android APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/android.yml'

concurrency:
  group: dyfala-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore persistent test signing key
        working-directory: flutter_app
        run: base64 --decode android/app/dyfala-test.keystore.b64 > android/app/dyfala-test.keystore

      - name: Get packages
        working-directory: flutter_app
        run: flutter pub get

      - name: Test game engine
        working-directory: flutter_app
        run: flutter test test/game_engine_test.dart

      - name: Build updateable test APK
        working-directory: flutter_app
        run: flutter build apk --debug --build-number="${GITHUB_RUN_NUMBER}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dyfala-test-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
